<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tavupeli — Kuvakatselmus</title>
  <style>
    body { margin: 0; padding: 28px; background: #FAF8F3; color: #262A2F; font-family: 'Avenir Next', 'Segoe UI', system-ui, sans-serif; }
    header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 1.6rem; }
    h2 { margin: 32px 0 14px; font-size: 1.15rem; color: #5E646C; }
    a { color: #2E6FB8; font-weight: 700; text-decoration: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 14px; }
    .tile { background: #FFFFFF; border: 1.5px solid #D8D3C8; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .art { width: 132px; height: 132px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; }
    .art.stone { background: #ECE7DE; border-radius: 12px; padding: 8px; }
    .art img, .art svg { width: 100%; height: 100%; object-fit: contain; }
    .word { font-weight: 800; font-size: 0.98rem; text-align: center; }
    .meta { font-size: 0.78rem; color: #6E747B; }
    .badge { font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #EFEBE0; color: #5E646C; }
    .badge.custom { background: #DCEFE0; color: #27693B; }
  </style>
</head>
<body>
  <header>
    <h1>Tavupeli — Kuvakatselmus</h1>
    <a href="./index.html">← Takaisin peliin</a>
  </header>
  <h2>Sanakortit (20)</h2>
  <div id="words-grid" class="grid"></div>
  <h2>Pelilauta, asemat & kortit (14)</h2>
  <div id="board-grid" class="grid"></div>
  <script src="./words.js"></script>
  <script src="./art.js"></script>
  <script>
    (async () => {
      await window.TavupeliArt.preloadAll();
      const wg = document.getElementById('words-grid');
      window.TAVUPELI_WORDS.forEach(w => {
        const ext = window.TavupeliArt.getResolvedUrl('words', w.id);
        const card = document.createElement('div');
        card.className = 'tile';
        const art = document.createElement('div');
        art.className = 'art';
        window.TavupeliArt.renderHtml(art, 'words', w.id, w.id);
        card.appendChild(art);
        card.insertAdjacentHTML('beforeend', `<div class="word">${w.syllables.join('-')}</div><div class="meta">img/words/${w.id}.webp</div><span class="badge${ext ? ' custom' : ''}">${ext ? 'Oma kuva' : 'SVG-varakuva'}</span>`);
        wg.appendChild(card);
      });
      const bg = document.getElementById('board-grid');
      window.TavupeliArt.BOARD_IDS.forEach(id => {
        const ext = window.TavupeliArt.getResolvedUrl('board', id);
        const card = document.createElement('div');
        card.className = 'tile';
        const art = document.createElement('div');
        art.className = `art${id === 'karhu-0' ? ' stone' : ''}`;
        window.TavupeliArt.renderHtml(art, 'board', id, id);
        card.appendChild(art);
        card.insertAdjacentHTML('beforeend', `<div class="word">${id}</div><div class="meta">img/board/${id}.webp</div><span class="badge${ext ? ' custom' : ''}">${ext ? 'Oma kuva' : 'SVG-varakuva'}</span>`);
        bg.appendChild(card);
      });
    })();
  </script>
</body>
</html>
